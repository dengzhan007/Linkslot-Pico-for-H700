name: Linkslot LK Rust feasibility

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/linkslot-lk-rust-feasibility.yml"
      - "scripts/audit-linkslot-nostd.py"
      - "scripts/audit-lk-bl33-layout.py"
      - "scripts/audit-slot-i18n-nostd.py"
      - "scripts/audit-libretro-static-abi.py"
      - "scripts/build-mgba-aarch32-static.py"
      - "scripts/build-mgba-aarch32-generic-static.py"
      - "scripts/build-mgba-libretro-vfs3-static.py"
      - "scripts/audit-libretro-vfs-v3-abi.py"
      - "platform/h700/**"
      - "scripts/build-h700-objects.sh"
  push:
    branches: ["porting/linkslot-1.0.36-feasibility"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkslot-lk-rust-feasibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout feasibility branch
        uses: actions/checkout@v4

      - name: Checkout immutable Linkslot 1.0.36 snapshot
        uses: actions/checkout@v4
        with:
          ref: upstream/linkslot
          path: .ci/upstream-linkslot
          persist-credentials: false

      - name: Checkout pinned mGBA source
        uses: actions/checkout@v4
        with:
          repository: libretro/mgba
          ref: e31759b24e7a4e3899285ff720d7b573ac328ae7
          path: .ci/mgba-source
          persist-credentials: false

      - name: Checkout pinned GammaOS LK reference
        uses: actions/checkout@v4
        with:
          repository: TheGammaSqueeze/lk-mt6785
          ref: 9bf1419a49e0af6dba8b05916df382c9c9c6d0a8
          path: .ci/lk-reference
          persist-credentials: false

      - name: Install LLVM cross-link tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld cmake gcc-arm-linux-gnueabi g++-arm-linux-gnueabi libc6-dev-armel-cross

      - name: Install pinned Rust toolchain and freestanding targets
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: armv7a-none-eabi,aarch64-unknown-none

      - name: Compile existing H700 AArch64 scaffold
        run: bash scripts/build-h700-objects.sh

      - name: Cross-compile Linkslot candidate logic and C ABI probes
        run: |
          python3 scripts/audit-linkslot-nostd.py \
            --source .ci/upstream-linkslot \
            --lk-source .ci/lk-reference \
            --out build/audit-work/linkslot-1.0.36

      - name: Test slot-i18n static no_std tables
        run: |
          python3 scripts/audit-slot-i18n-nostd.py \
            --source .ci/upstream-linkslot \
            --out build/audit-work/linkslot-1.0.36/slot-i18n

      - name: Test static Libretro core ABI registry
        run: |
          python3 scripts/audit-libretro-static-abi.py \
            --out build/audit-work/linkslot-1.0.36/static-libretro

      - name: Test no_std Libretro VFS v3 service ABI
        run: |
          python3 scripts/audit-libretro-vfs-v3-abi.py \
            --out build/audit-work/linkslot-1.0.36/libretro-vfs-v3

      - name: Build pinned mGBA as AArch32 namespaced static archive
        run: |
          python3 scripts/build-mgba-aarch32-static.py \
            --source .ci/mgba-source \
            --out build/audit-work/linkslot-1.0.36/mgba-static

      - name: Build mGBA with Generic CMake backend for LK comparison
        run: |
          python3 scripts/build-mgba-aarch32-generic-static.py --source .ci/mgba-source --out build/audit-work/linkslot-1.0.36/mgba-generic

      - name: Build mGBA with required Libretro VFS v3 file and directory backend
        run: |
          python3 scripts/build-mgba-libretro-vfs3-static.py --source .ci/mgba-source --out build/audit-work/linkslot-1.0.36/mgba-vfs3

      - name: Probe AArch32 LK-as-BL33 image and vector layout
        run: |
          python3 scripts/audit-lk-bl33-layout.py \
            --lk-source .ci/lk-reference \
            --out build/audit-work/linkslot-1.0.36/lk-bl33-layout

      - name: Publish build report in job summary
        if: always()
        run: |
          if [ -f build/audit-work/linkslot-1.0.36/REPORT.md ]; then
            cat build/audit-work/linkslot-1.0.36/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload maps, ELFs, logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkslot-lk-rust-feasibility-${{ github.run_id }}
          path: |
            build/audit-work/linkslot-1.0.36/
            build/h700-objects/
          if-no-files-found: warn
          retention-days: 30
