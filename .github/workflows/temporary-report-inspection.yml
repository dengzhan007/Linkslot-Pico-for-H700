name: Temporary RG34XX report archive inspection

on:
  push:
    branches:
      - "audit/inspect-rg34xx-report-20261122"

permissions:
  contents: read

jobs:
  inspect-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Checkout field reports
        uses: actions/checkout@v4
        with:
          ref: reports
          path: reports

      - name: Inspect FDT and OP-TEE references
        shell: bash
        run: |
          set -euo pipefail
          archive="reports/reports/rg34xx-inventory-20261122-195053.zip"
          python3 - "$archive" <<'PY'
          import json
          import pathlib
          import sys
          import zipfile

          with zipfile.ZipFile(pathlib.Path(sys.argv[1])) as zf:
              for name in ("live-fdt.json", "toc1-extracted/dtb-report.json"):
                  info = next(
                      (x for x in zf.infolist()
                       if x.filename.replace("\\\\", "/").replace("\\", "/").endswith(name)),
                      None,
                  )
                  if not info:
                      print(f"MISSING: {name}")
                      continue
                  raw = zf.read(info).decode("utf-8", "replace")
                  print(f"===== {name} RAW JSON =====")
                  print(raw)
                  try:
                      obj = json.loads(raw)
                  except Exception as exc:
                      print(f"JSON_PARSE_ERROR: {exc}")
                      continue
                  print(f"===== {name} FILTERED REFERENCES =====")
                  def walk(value, path="$"):
                      if isinstance(value, dict):
                          for key, child in value.items():
                              p = f"{path}.{key}"
                              if any(word in str(key).lower() for word in (
                                  "tee", "optee", "secure", "reserved", "memory", "firmware",
                                  "monitor", "dram", "cma"
                              )):
                                  print(f"{p}: {child!r}")
                              walk(child, p)
                      elif isinstance(value, list):
                          for index, child in enumerate(value):
                              walk(child, f"{path}[{index}]")
                  walk(obj)
          PY
