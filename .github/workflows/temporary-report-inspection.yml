name: Temporary RG34XX report archive inspection

on:
  push:
    branches:
      - "audit/inspect-rg34xx-report-20261122"

permissions:
  contents: read

jobs:
  inspect-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Checkout field reports
        uses: actions/checkout@v4
        with:
          ref: reports
          path: reports

      - name: Decompile live FDT and inspect secure nodes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq device-tree-compiler
          python3 - <<'PY'
          import pathlib
          import zipfile

          archive = pathlib.Path("reports/reports/rg34xx-inventory-20261122-195053.zip")
          with zipfile.ZipFile(archive) as zf:
              info = next(
                  x for x in zf.infolist()
                  if x.filename.replace("\\\\", "/").replace("\\", "/").endswith("live-fdt.dtb")
              )
              pathlib.Path("/tmp/live-fdt.dtb").write_bytes(zf.read(info))
          PY
          dtc -I dtb -O dts /tmp/live-fdt.dtb -o /tmp/live-fdt.dts
          echo "===== SECURE / TEE / RESERVED / MEMORY NODES ====="
          grep -Ein -C 8 'optee|tee|reserved-memory|secure|memory@|firmware|monitor|scp|dram' /tmp/live-fdt.dts || true
          echo "===== ALL NODE PATHS OF INTEREST ====="
          grep -Ein '^([[:space:]]*[[:alnum:]_@,.-]+[[:space:]]*\{|[[:space:]]*compatible[[:space:]]*=|[[:space:]]*method[[:space:]]*=|[[:space:]]*reg[[:space:]]*=|[[:space:]]*no-map)' /tmp/live-fdt.dts | grep -Ei 'optee|tee|reserved|secure|firmware|monitor|memory|reg|no-map|method' | head -n 200
