name: Temporary RG34XX report archive inspection

on:
  push:
    branches:
      - "audit/inspect-rg34xx-report-20261122"

permissions:
  contents: read

jobs:
  inspect-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Checkout field reports
        uses: actions/checkout@v4
        with:
          ref: reports
          path: reports

      - name: Checkout current parser
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Run current FDT parser on captured live DTB
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import zipfile

          archive = pathlib.Path("reports/reports/rg34xx-inventory-20261122-195053.zip")
          with zipfile.ZipFile(archive) as zf:
              info = next(
                  x for x in zf.infolist()
                  if x.filename.replace("\\\\", "/").replace("\\", "/").endswith("live-fdt.dtb")
              )
              pathlib.Path("/tmp/live-fdt.dtb").write_bytes(zf.read(info))
          PY
          python3 source/tools/inspect_h700_fdt.py /tmp/live-fdt.dtb > /tmp/live-fdt-parser.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/live-fdt-parser.json").read_text())
          keys = {
              "file_bytes": report["file_bytes"],
              "sha256": report["sha256"],
              "initrd": report["initrd"],
              "has_reserved_memory_node": report["has_reserved_memory_node"],
              "firmware_nodes": report["firmware_nodes"],
              "ion_heaps": report["ion_heaps"],
              "memory_regions": report["memory_regions"],
              "boot_framebuffers": report["boot_framebuffers"],
          }
          print(json.dumps(keys, indent=2, sort_keys=True))
          PY
