name: Temporary RG34XX ION TEE configuration inspection

on:
  push:
    branches:
      - "audit/inspect-rg34xx-report-20261122"

permissions:
  contents: read

jobs:
  inspect-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Checkout field reports
        uses: actions/checkout@v4
        with:
          ref: reports
          path: reports

      - name: Inspect captured configs and ION/TEE log lines
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip
          import pathlib
          import re
          import zipfile

          archive = pathlib.Path("reports/reports/rg34xx-inventory-20261122-195053.zip")
          with zipfile.ZipFile(archive) as zf:
              files = [x for x in zf.infolist() if not x.is_dir()]
              print("===== ARCHIVE PATHS WITH CONFIG / ION / TEE / DMESG =====")
              for info in files:
                  path = info.filename.replace("\\\\", "/").replace("\\", "/")
                  if re.search(r"config|ion|tee|dmesg|iomem|memblock", path, re.I):
                      print(f"{path} ({info.file_size} bytes)")

              print("===== CONFIG FILES: TEE / CMA / ION OPTIONS =====")
              config_files = [
                  x for x in files
                  if re.search(r"(^|/)(config(\.gz)?|kernel\.config|proc/config\.gz)$",
                               x.filename.replace("\\\\", "/").replace("\\", "/"), re.I)
              ]
              if not config_files:
                  print("NO_KERNEL_CONFIG_CAPTURED")
              for info in config_files:
                  raw = zf.read(info)
                  if info.filename.endswith(".gz"):
                      try:
                          raw = gzip.decompress(raw)
                      except Exception:
                          pass
                  print(f"===== {info.filename} =====")
                  text = raw.decode("utf-8", "replace")
                  matched = [line for line in text.splitlines()
                             if re.search(r"CONFIG_(TEE|OPTEE|SUNXI_ION|ION|CMA|DMA_CMA|OF_RESERVED_MEM)",
                                          line)]
                  print("\\n".join(matched) if matched else "NO_MATCHING_CONFIG_LINES")

              print("===== HARDWARE DMESG: ION / TEE / DRM / SECURE / CMA =====")
              logs = [
                  x for x in files
                  if x.filename.replace("\\\\", "/").replace("\\", "/").rsplit("/", 1)[-1]
                  == "dmesg-hardware-lines.txt"
              ]
              terms = re.compile(r"Ion:|ion[-_ ]|drm_base|drm_size|tee_base|optee|secure|cma|BL31|ATF|trusted", re.I)
              for info in logs:
                  text = zf.read(info).decode("utf-8", "replace")
                  for i, line in enumerate(text.splitlines(), 1):
                      if terms.search(line):
                          print(f"{i}: {line}")
          PY
