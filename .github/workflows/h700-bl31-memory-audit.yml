name: RG34XX BL31 static memory audit

on:
  push:
    branches: [porting/linkslot-1.0.45-feasibility]
    paths:
      - "scripts/audit-rg34xx-bl31-memory.py"
      - "scripts/test-audit-rg34xx-bl31-memory.py"
      - "scripts/test-rg34xx-bl31-startup-contract.py"
      - "scripts/audit-rg34xx-boot0-cpu-reset.py"
      - "scripts/audit-rg34xx-boot0-dram-geometry.py"
      - "scripts/test-audit-rg34xx-boot0-dram-geometry.py"
      - "scripts/test-audit-rg34xx-boot0-cpu-reset.py"
      - "scripts/audit-rg34xx-bl31-full-image-cpu-mmio.py"
      - "scripts/test-audit-rg34xx-bl31-full-image-cpu-mmio.py"
      - "scripts/audit-rg34xx-bl31-psci-cpu-on.py"
      - "scripts/test-audit-rg34xx-bl31-psci-cpu-on.py"
      - "scripts/audit-rg34xx-dram-window-ownership.py"
      - "scripts/test-audit-rg34xx-dram-window-ownership.py"
      - "scripts/audit-rg34xx-dram-pfn-metadata.py"
      - "scripts/test-audit-rg34xx-dram-pfn-metadata.py"
      - "scripts/audit-rg34xx-bl31-twi-descriptors.py"
      - "scripts/test-audit-rg34xx-bl31-twi-descriptors.py"
      - "scripts/audit-rg34xx-bl31-twi-relocation.py"
      - "scripts/test-audit-rg34xx-bl31-twi-relocation.py"
      - ".github/workflows/h700-bl31-memory-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-matched-bl31:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout audit scripts
        uses: actions/checkout@v4

      - name: Checkout read-only RG34XX reports
        uses: actions/checkout@v4
        with:
          ref: reports
          path: .ci/reports

      - name: Checkout pinned BaseOS native SPL source
        uses: actions/checkout@v4
        with:
          repository: dengzhan007/BaseOS-MultiFrontend
          ref: cbe253a43f46cf551cc9a6c79a84015bde3686cf
          path: .ci/baseos-native

      - name: Install pinned Capstone disassembler
        run: |
          python3 -m pip install --disable-pip-version-check capstone==5.0.6

      - name: Test BL31 audit primitives
        run: |
          python3 scripts/test-audit-rg34xx-bl31-memory.py

      - name: Verify matched BL31 flag and pinned native SPL preservation
        run: |
          python3 scripts/test-rg34xx-bl31-startup-contract.py \
            --reports-root .ci/reports/reports \
            --baseos-root .ci/baseos-native \
            --out build/rg34xx-bl31-static-audit

      - name: Verify matched monitor identity and scan BL31 references
        run: |
          python3 scripts/audit-rg34xx-bl31-memory.py \
            --reports-root .ci/reports/reports \
            --out build/rg34xx-bl31-static-audit

      - name: Test Boot0 DRAM geometry decoder
        run: |
          python3 scripts/test-audit-rg34xx-boot0-dram-geometry.py

      - name: Cross-check Boot0 DRAM geometry against Linux runtime memblock
        run: |
          python3 scripts/audit-rg34xx-boot0-dram-geometry.py \\
            --primary .ci/reports/reports/rg34xx-inventory-20261127-uart/boot0-primary.json \\
            --secondary .ci/reports/reports/rg34xx-inventory-20261127-uart/boot0-secondary.json \\
            --memory-map .ci/reports/reports/rg34xx-inventory-20261127-uart/memory-map-report.json \\
            --out-dir build/rg34xx-bl31-static-audit

      - name: Test Boot0 CPU reset-bit interpretation (H616 reference only)
        run: |
          python3 scripts/test-audit-rg34xx-boot0-cpu-reset.py

      - name: Audit Boot0 CPU reset helper and BL31 secondary-core MMIO
        run: |
          python3 scripts/audit-rg34xx-boot0-cpu-reset.py \
            --reports-root .ci/reports/reports \
            --baseos-root .ci/baseos-native \
            --bl31-report build/rg34xx-bl31-static-audit/report.json \
            --out build/rg34xx-bl31-static-audit

      - name: Test BL31 whole-payload CPU/MMIO scanner
        run: |
          python3 scripts/test-audit-rg34xx-bl31-full-image-cpu-mmio.py

      - name: Scan entire matched BL31 payload for CPU/MMIO candidates
        run: |
          python3 scripts/audit-rg34xx-bl31-full-image-cpu-mmio.py \
            --reports-root .ci/reports/reports \
            --out build/rg34xx-bl31-static-audit

      - name: Test DRAM retention source-page ownership classifier
        run: |
          python3 scripts/test-audit-rg34xx-dram-window-ownership.py

      - name: Classify fixed BL31 DRAM retention source page (report only; fail-closed)
        run: |
          python3 scripts/audit-rg34xx-dram-window-ownership.py \
            --input .ci/reports/reports/rg34xx-inventory-20261126-timer/memory-map-report.json \
            --out-dir build/rg34xx-bl31-static-audit

      - name: Test Linux 4.9.170 DRAM PFN metadata decoder
        run: |
          python3 scripts/test-audit-rg34xx-dram-pfn-metadata.py

      - name: Decode captured Linux 4.9.170 DRAM PFN metadata (read-only)
        run: |
          python3 scripts/audit-rg34xx-dram-pfn-metadata.py \
            --input .ci/reports/reports/rg34xx-dram-pfn-20261127/dram-retention-pfn.txt \
            --out-dir build/rg34xx-bl31-static-audit

      - name: Test matched BL31 PSCI CPU_ON verifier
        run: |
          python3 scripts/test-audit-rg34xx-bl31-psci-cpu-on.py

      - name: Audit matched BL31 PSCI CPU_ON platform callback
        run: |
          python3 scripts/audit-rg34xx-bl31-psci-cpu-on.py \
            --monitor .ci/reports/reports/rg34xx-inventory-20261126-timer/toc1-extracted/items/monitor.bin \
            --baseos-root .ci/baseos-native \
            --out build/rg34xx-bl31-static-audit/psci-cpu-on-report.json

      - name: Test RTC soft-entry TWI descriptor audit
        run: |
          python3 scripts/test-audit-rg34xx-bl31-twi-descriptors.py

      - name: Audit RTC soft-entry TWI descriptor initialization boundary
        run: |
          python3 scripts/audit-rg34xx-bl31-twi-descriptors.py \
            --monitor .ci/reports/reports/rg34xx-inventory-20261126-timer/toc1-extracted/items/monitor.bin \
            --baseos-source .ci/baseos-native/experiments/h700-boot-speed/spl/native-boot.c \
            --out-dir build/rg34xx-bl31-static-audit

      - name: Test RTC TWI selector provenance and SRAM relocation
        run: |
          python3 scripts/test-audit-rg34xx-bl31-twi-relocation.py

      - name: Audit RTC TWI selector from original TOC1 FDT and relocated monitor
        run: |
          python3 scripts/audit-rg34xx-bl31-twi-relocation.py \
            --monitor .ci/reports/reports/rg34xx-inventory-20261126-timer/toc1-extracted/items/monitor.bin \
            --dtb .ci/reports/reports/rg34xx-inventory-20261126-timer/toc1-extracted/items/dtb.bin \
            --baseos-source .ci/baseos-native/experiments/h700-boot-speed/spl/native-boot.c \
            --out-dir build/rg34xx-bl31-static-audit

      - name: Publish audit report
        if: always()
        run: |
          if [ -f build/rg34xx-bl31-static-audit/REPORT.md ]; then
            cat build/rg34xx-bl31-static-audit/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/rg34xx-bl31-static-audit/STARTUP-CONTRACT.md ]; then
            cat build/rg34xx-bl31-static-audit/STARTUP-CONTRACT.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/rg34xx-bl31-static-audit/BOOT0-CPU-STARTUP.md ]; then
            cat build/rg34xx-bl31-static-audit/BOOT0-CPU-STARTUP.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/rg34xx-bl31-static-audit/FULL-IMAGE-MMIO.md ]; then
            cat build/rg34xx-bl31-static-audit/FULL-IMAGE-MMIO.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/rg34xx-bl31-static-audit/PSCI-CPU-ON.md ]; then
            cat build/rg34xx-bl31-static-audit/PSCI-CPU-ON.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/rg34xx-bl31-static-audit/DRAM-WINDOW-OWNERSHIP.md ]; then
            cat build/rg34xx-bl31-static-audit/DRAM-WINDOW-OWNERSHIP.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/rg34xx-bl31-static-audit/DRAM-PFN-METADATA.md ]; then
            cat build/rg34xx-bl31-static-audit/DRAM-PFN-METADATA.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/rg34xx-bl31-static-audit/BOOT0-DRAM-GEOMETRY.md ]; then
            cat build/rg34xx-bl31-static-audit/BOOT0-DRAM-GEOMETRY.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/rg34xx-bl31-static-audit/TWI-DESCRIPTOR.md ]; then
            cat build/rg34xx-bl31-static-audit/TWI-DESCRIPTOR.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/rg34xx-bl31-static-audit/TWI-SELECTOR-RELOCATION.md ]; then
            cat build/rg34xx-bl31-static-audit/TWI-SELECTOR-RELOCATION.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload captured Boot0 binaries for read-only host CPU-start audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rg34xx-boot0-readonly-source-capture
          path: |
            .ci/reports/reports/rg34xx-inventory-20261126-timer/boot0-primary.bin
            .ci/reports/reports/rg34xx-inventory-20261126-timer/boot0-secondary.bin
            .ci/reports/reports/rg34xx-inventory-20261126-timer/boot0-primary.json
            .ci/reports/reports/rg34xx-inventory-20261126-timer/boot0-secondary.json
            .ci/reports/reports/rg34xx-inventory-20261126-timer/toc1-extracted/items/monitor.bin
          if-no-files-found: error
          retention-days: 30
      - name: Upload BL31 disassembly and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rg34xx-bl31-static-audit
          path: build/rg34xx-bl31-static-audit/
          if-no-files-found: warn
          retention-days: 30
