name: H700 boot audit tools

on:
  push:
    paths:
      - "scripts/collect-rg34xx-readonly-inventory.sh"
      - "scripts/collect-rg34xx-pio-input-readonly.sh"
      - "scripts/collect-rg34xx-gpio-debugfs-readonly.sh"
      - "scripts/collect-rg34xx-dram-pfn-readonly.sh"
      - "scripts/audit-rg34xx-dram-pfn-metadata.py"
      - "scripts/test-audit-rg34xx-dram-pfn-metadata.py"
      - "scripts/run-rg34xx-inventory.ps1"
      - "scripts/read-h700-rvbar-selector-readonly.py"
      - "scripts/test-read-h700-rvbar-selector-readonly.py"
      - "tools/**"
      - "ci/rg34xx_boot0_disassemble.py"
      - "docs/**"
      - ".github/workflows/h700-boot-audit-tools.yml"
  pull_request:
    paths:
      - "ci/rg34xx_boot0_disassemble.py"
      - "scripts/collect-rg34xx-readonly-inventory.sh"
      - "scripts/collect-rg34xx-pio-input-readonly.sh"
      - "scripts/collect-rg34xx-gpio-debugfs-readonly.sh"
      - "scripts/run-rg34xx-inventory.ps1"
      - "scripts/collect-rg34xx-dram-pfn-readonly.sh"
      - "scripts/audit-rg34xx-dram-pfn-metadata.py"
      - "scripts/test-audit-rg34xx-dram-pfn-metadata.py"
      - "tools/**"
      - "docs/**"
      - ".github/workflows/h700-boot-audit-tools.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          sh -n scripts/collect-rg34xx-readonly-inventory.sh
          sh -n scripts/collect-rg34xx-pio-input-readonly.sh
          sh -n scripts/collect-rg34xx-gpio-debugfs-readonly.sh
          sh -n scripts/collect-rg34xx-dram-pfn-readonly.sh

      - name: Run TOC1 parser tests
        run: python3 -m unittest discover -s tools -p "test_*.py" -v

      - name: Test read-only H700 RVBAR selector classification
        run: python3 scripts/test-read-h700-rvbar-selector-readonly.py

      - name: Test dual-page RG34XX DRAM PFN metadata decoder
        run: python3 scripts/test-audit-rg34xx-dram-pfn-metadata.py

      - name: Disassemble RG34XX stock Boot0 (static only)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'disassemble')
        run: |
          git fetch --filter=blob:none --no-tags --depth=1 origin refs/heads/reports:refs/remotes/origin/reports
          mkdir -p build/rg34xx-boot0-input
          git show refs/remotes/origin/reports:reports/rg34xx-inventory-20261127-uart/boot0-primary.bin > build/rg34xx-boot0-input/boot0-primary.bin
          git show refs/remotes/origin/reports:reports/rg34xx-inventory-20261127-uart/boot0-secondary.bin > build/rg34xx-boot0-input/boot0-secondary.bin
          git show refs/remotes/origin/reports:reports/rg34xx-inventory-20261127-uart/toc1-package.bin > build/rg34xx-boot0-input/toc1-package.bin
          git show refs/remotes/origin/reports:reports/rg34xx-inventory-20261127-uart/live-fdt.dtb > build/rg34xx-boot0-input/live-fdt.dtb
          sudo apt-get update
          sudo apt-get install -y binutils-arm-linux-gnueabihf
          python3 ci/rg34xx_boot0_disassemble.py \
            --primary build/rg34xx-boot0-input/boot0-primary.bin \
            --secondary build/rg34xx-boot0-input/boot0-secondary.bin \
            --toc1 build/rg34xx-boot0-input/toc1-package.bin \
            --fdt build/rg34xx-boot0-input/live-fdt.dtb \
            --outdir build/rg34xx-boot0-disassembly

      - name: Upload RG34XX Boot0 static disassembly
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, 'disassemble')
        uses: actions/upload-artifact@v4
        with:
          name: rg34xx-stock-boot0-static-disassembly
          path: build/rg34xx-boot0-disassembly/
          if-no-files-found: warn
          retention-days: 7


  windows-powershell:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run host-tool unit tests on Windows
        run: python -m unittest discover -s tools -p "test_*.py" -v

      - name: Validate Windows inventory wrapper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path "scripts/run-rg34xx-inventory.ps1").Path
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
