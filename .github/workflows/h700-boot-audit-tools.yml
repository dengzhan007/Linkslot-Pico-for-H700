name: H700 boot audit tools

on:
  push:
    paths:
      - "scripts/collect-rg34xx-readonly-inventory.sh"
      - "scripts/collect-rg34xx-pio-input-readonly.sh"
      - "scripts/collect-rg34xx-gpio-debugfs-readonly.sh"
      - "scripts/collect-rg34xx-dram-pfn-readonly.sh"
      - "scripts/run-rg34xx-inventory.ps1"
      - "scripts/read-h700-rvbar-selector-readonly.py"
      - "scripts/test-read-h700-rvbar-selector-readonly.py"
      - "tools/**"
      - "docs/**"
      - ".github/workflows/h700-boot-audit-tools.yml"
  pull_request:
    paths:
      - "scripts/collect-rg34xx-readonly-inventory.sh"
      - "scripts/collect-rg34xx-pio-input-readonly.sh"
      - "scripts/collect-rg34xx-gpio-debugfs-readonly.sh"
      - "scripts/run-rg34xx-inventory.ps1"
      - "tools/**"
      - "docs/**"
      - ".github/workflows/h700-boot-audit-tools.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          sh -n scripts/collect-rg34xx-readonly-inventory.sh
          sh -n scripts/collect-rg34xx-pio-input-readonly.sh
          sh -n scripts/collect-rg34xx-gpio-debugfs-readonly.sh
          sh -n scripts/collect-rg34xx-dram-pfn-readonly.sh

      - name: Run TOC1 parser tests
        run: python3 -m unittest discover -s tools -p "test_*.py" -v

      - name: Test read-only H700 RVBAR selector classification
        run: python3 scripts/test-read-h700-rvbar-selector-readonly.py

  windows-powershell:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run host-tool unit tests on Windows
        run: python -m unittest discover -s tools -p "test_*.py" -v

      - name: Validate Windows inventory wrapper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path "scripts/run-rg34xx-inventory.ps1").Path
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
