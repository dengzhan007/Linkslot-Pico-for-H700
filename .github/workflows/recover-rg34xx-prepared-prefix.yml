name: Recover audited RG34XX prepared boot prefix

on:
  push:
    branches:
      - porting/linkslot-1.0.36-feasibility
    paths:
      - .github/workflows/recover-rg34xx-prepared-prefix.yml

permissions:
  contents: read

jobs:
  recover:
    name: Download and verify source prefix (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install zstd
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Download pinned prepared bundle and extract only RG34XX prefix
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/baseos-prepared-20260914.tar.zst"
          url="https://github.com/pvaibhav/BaseOS/releases/download/prepared-20260914/baseos-prepared-20260914.tar.zst"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error "$url" -o "$bundle"
          printf '%s  %s\n' \
            "86a0186b5ac8ab907dc1d5c24220c9fcd94f38dd9dc3fddb7fb5cf59d4c7719f" \
            "$bundle" | sha256sum --check -
          mkdir -p build/recovered-prefix
          zstd --decompress --long=31 --stdout "$bundle" |
            tar --extract --to-stdout --file=- rg34xx/boot-prefix.img \
              > build/recovered-prefix/boot-prefix.img
          test "$(stat -c '%s' build/recovered-prefix/boot-prefix.img)" = "222298112"
          printf '%s  %s\n' \
            "fb75bc4c835fa74ff41c0a1fdbe79b8871a960fc249716847fb7be529835c3c3" \
            "build/recovered-prefix/boot-prefix.img" | sha256sum --check -
          {
            echo "artifact=RG34XX prepared boot-prefix.img"
            echo "bundle_sha256=86a0186b5ac8ab907dc1d5c24220c9fcd94f38dd9dc3fddb7fb5cf59d4c7719f"
            echo "prefix_bytes=222298112"
            echo "prefix_sha256=fb75bc4c835fa74ff41c0a1fdbe79b8871a960fc249716847fb7be529835c3c3"
            echo "hardware_access=none"
            echo "device_io=none"
            echo "flash_or_image_modification=none"
          } > build/recovered-prefix/README.txt

      - name: Upload verified prefix as short-lived CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: RG34XX-Prepared-Boot-Prefix-${{ github.sha }}
          path: build/recovered-prefix/
          if-no-files-found: error
          retention-days: 3

  recover-uboot-source:
    name: Recover pinned U-Boot v2026.10 source archive
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download candidate archive and enforce native builder pin
        shell: bash
        run: |
          set -euo pipefail
          expected="f943a88389c8fd70a6b0d061a88267465e143c7ca6ea2b75837ab20f5b60c739"
          mkdir -p build/uboot-source
          urls=(
            "https://github.com/u-boot/u-boot/archive/refs/tags/v2026.10.tar.gz"
            "https://git.u-boot-project.org/u-boot/u-boot/-/archive/v2026.10/u-boot-v2026.10.tar.gz"
          )
          found=0
          for index in "${!urls[@]}"; do
            candidate="$RUNNER_TEMP/u-boot-candidate-$index.tar.gz"
            echo "Trying ${urls[$index]}"
            if ! curl --fail --location --retry 2 --retry-delay 2 --silent --show-error \
                 --connect-timeout 20 "${urls[$index]}" -o "$candidate"; then
              echo "Candidate download failed; trying the next canonical source."
              continue
            fi
            got="$(sha256sum "$candidate" | cut -d' ' -f1)"
            echo "Candidate SHA-256: $got"
            if [ "$got" = "$expected" ]; then
              cp "$candidate" build/uboot-source/u-boot-v2026.10.tar.gz
              {
                echo "url=${urls[$index]}"
                echo "sha256=$got"
                echo "bytes=$(stat -c '%s' "$candidate")"
                echo "archive_root=$(tar -tzf "$candidate" | head -n 1)"
              } > build/uboot-source/README.txt
              found=1
              break
            fi
          done
          test "$found" = 1
          printf '%s  %s\n' "$expected" build/uboot-source/u-boot-v2026.10.tar.gz | sha256sum --check -

      - name: Upload exact pinned U-Boot source archive
        uses: actions/upload-artifact@v4
        with:
          name: H700-Pinned-U-Boot-v2026.10-${{ github.sha }}
          path: build/uboot-source/
          if-no-files-found: error
          retention-days: 3
