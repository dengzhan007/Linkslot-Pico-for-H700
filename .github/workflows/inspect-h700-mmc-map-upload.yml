name: Inspect uploaded H700 MMC map
on:
  push:
    branches:
      - porting/linkslot-1.0.36-feasibility
    paths:
      - .github/workflows/inspect-h700-mmc-map-upload.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reports branch
        uses: actions/checkout@v4
        with:
          ref: reports
          path: reports
      - name: Extract read-only capture
        shell: bash
        run: |
          set -euo pipefail
          archive="reports/reports/h700-mmc-map-r2.tar.gz"
          test -s "$archive"
          echo "=== ARCHIVE CONTENTS ==="
          tar -tzf "$archive"
          echo "=== MMC MAP ==="
          tar -xOzf "$archive" ./mmc-map.txt
