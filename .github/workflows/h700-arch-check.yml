name: H700 AArch32/AArch64 compile check

on:
  push:
    paths:
      - "platform/h700/**"
      - "target/rg34xx_h700/**"
      - "scripts/build-h700-objects.sh"
      - "scripts/test-h700-cpu-performance-policy.sh"
      - "scripts/test-h700-cpu-performance-service.sh"
      - "scripts/test-h700-rg34xx-power-led.sh"
      - "scripts/test-h700-pio-mmu-mapping.sh"
      - "scripts/collect-rg34xx-readonly-inventory.sh"
      - "tools/test_inventory_script_safety.py"
      - "tools/inspect_h700_fdt.py"
      - "tools/test_inspect_h700_fdt.py"
      - "scripts/test-h700-gpt-readonly.sh"
      - "scripts/test-h700-sunxi-mmc-clock.sh"
      - "scripts/test-h700-sunxi-mmc-module-clock.sh"
      - "scripts/test-h700-sunxi-mmc-pio-read.sh"
      - "scripts/test-h700-sunxi-sd-csd.sh"
      - "scripts/test-h700-sunxi-sd-card-init.sh"
      - "scripts/test-h700-h616-sdc0-platform.sh"
      - "scripts/test-h700-h616-sdc0-pins.sh"
      - "scripts/test-h700-sunxi-mmc-gpt-adapter.sh"
      - "scripts/test-h700-sunxi-mmc-gpt-integration.sh"
      - "scripts/test-h700-sdc0-readonly-scan.sh"
      - "platform/h700/storage/fat/**"
      - "scripts/test-h700-fat-partition-bounds.sh"
      - "scripts/test-h700-sunxi-mmc-fat.sh"
      - "scripts/test-h700-sunxi-mmc-fat-scan.sh"
      - "scripts/test-h700-fat-vfs-backend.sh"
      - "scripts/test-h700-sdc0-fat-vfs-bootstrap.sh"
      - ".github/workflows/h700-arch-check.yml"
  pull_request:
    paths:
      - "platform/h700/**"
      - "target/rg34xx_h700/**"
      - "scripts/build-h700-objects.sh"
      - "scripts/test-h700-cpu-performance-service.sh"
      - "scripts/test-h700-rg34xx-power-led.sh"
      - "scripts/test-h700-pio-mmu-mapping.sh"
      - "scripts/collect-rg34xx-readonly-inventory.sh"
      - "tools/test_inventory_script_safety.py"
      - "tools/inspect_h700_fdt.py"
      - "tools/test_inspect_h700_fdt.py"
      - "scripts/test-h700-gpt-readonly.sh"
      - "scripts/test-h700-sunxi-mmc-clock.sh"
      - "scripts/test-h700-sunxi-mmc-module-clock.sh"
      - "scripts/test-h700-sunxi-mmc-pio-read.sh"
      - "scripts/test-h700-sunxi-sd-csd.sh"
      - "scripts/test-h700-sunxi-sd-card-init.sh"
      - "scripts/test-h700-h616-sdc0-platform.sh"
      - "scripts/test-h700-h616-sdc0-pins.sh"
      - "scripts/test-h700-sunxi-mmc-gpt-adapter.sh"
      - "scripts/test-h700-sunxi-mmc-gpt-integration.sh"
      - ".github/workflows/h700-arch-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-host-regression:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run H700 read-only storage host regressions
        run: |
          sh scripts/test-h700-gpt-readonly.sh
          sh scripts/test-h700-cpu-performance-service.sh
          sh scripts/test-h700-rg34xx-power-led.sh
          sh scripts/test-h700-pio-mmu-mapping.sh
          python3 tools/test_inventory_script_safety.py
          python3 tools/test_inspect_h700_fdt.py
          sh scripts/test-h700-sunxi-mmc-clock.sh
          sh scripts/test-h700-sunxi-mmc-module-clock.sh
          sh scripts/test-h700-sunxi-mmc-pio-read.sh
          sh scripts/test-h700-sunxi-sd-csd.sh
          sh scripts/test-h700-sunxi-sd-card-init.sh
          sh scripts/test-h700-h616-sdc0-platform.sh
          sh scripts/test-h700-h616-sdc0-pins.sh
          sh scripts/test-h700-sunxi-mmc-gpt-adapter.sh
          sh scripts/test-h700-sunxi-mmc-gpt-integration.sh
          sh scripts/test-h700-sdc0-readonly-scan.sh
          sh scripts/test-h700-fat-partition-bounds.sh
          sh scripts/test-h700-sunxi-mmc-fat.sh
          sh scripts/test-h700-sunxi-mmc-fat-scan.sh
          sh scripts/test-h700-fat-vfs-backend.sh
          sh scripts/test-h700-sdc0-fat-vfs-bootstrap.sh

  compile-freestanding-objects:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Compile freestanding AArch64 H700 objects
        run: H700_ARCH=aarch64 bash scripts/build-h700-objects.sh

      - name: Compile freestanding AArch32 ARM-state Cortex-A53 H700 objects
        run: H700_ARCH=aarch32 H700_A32_STATE=arm bash scripts/build-h700-objects.sh

      - name: Compile freestanding AArch32 Thumb-2 Cortex-A53 H700 objects (GammaOS LK default C mode)
        run: H700_ARCH=aarch32 H700_A32_STATE=thumb bash scripts/build-h700-objects.sh
